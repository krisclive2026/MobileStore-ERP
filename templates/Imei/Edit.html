
{% extends "base.html" %}

{% block title %}Edit Handset | Mobile Store ERP{% endblock %}

{% block content %}
<div class="container-fluid px-3 px-lg-4 py-4">

    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4">
        <div>
            <h4 class="mb-1">Edit Handset Details</h4>
            <p class="text-muted mb-0">Update individual handset information</p>
        </div>

        <a href="{{ url_for('view_imei_record', record_id=record.id) }}"
           class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i> Back to Details
        </a>
    </div>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <h6 class="text-primary mb-3">Mobile Information</h6>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Product</label>
                        <input type="text" class="form-control"
                               value="{{ record.product.name }}" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Brand / Model</label>
                        <input type="text" class="form-control"
                               value="{{ record.product.brand }} {{ record.product.model }}" readonly>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">IMEI 1 *</label>
                        <input type="text" name="imei1" class="form-control"
                               maxlength="15" inputmode="numeric"
                               value="{{ record.imei1 }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">IMEI 2</label>
                        <input type="text" name="imei2" class="form-control"
                               maxlength="15" inputmode="numeric"
                               value="{{ record.imei2 or '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Variant / Storage</label>
                        <input type="text" name="variant" class="form-control"
                               value="{{ record.variant or '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Colour</label>
                        <input type="text" name="color" class="form-control"
                               value="{{ record.color or '' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Condition *</label>
                        <select name="condition" class="form-select" required>
                            <option value="Sealed" {% if record.condition == 'Sealed' %}selected{% endif %}>Sealed</option>
                            <option value="Used" {% if record.condition == 'Used' %}selected{% endif %}>Used</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Used Grade</label>
                        <input type="text" name="used_grade" class="form-control"
                               value="{{ record.used_grade or '' }}">
                    </div>

                </div>

                <hr class="my-4">

                <h6 class="text-primary mb-3">Pricing & Tax Details</h6>

                <div class="row g-3">

                    <div class="col-md-6">
                        <label class="form-label">Purchase Cost *</label>
                        <input type="number" name="purchase_price" class="form-control"
                               step="0.01" min="0"
                               value="{{ record.purchase_price or 0 }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Selling Price *</label>
                        <input type="number" name="selling_price" class="form-control"
                               step="0.01" min="0"
                               value="{{ record.selling_price or 0 }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">GST (%) *</label>
                        <input type="number" name="gst_percent" class="form-control"
                               step="0.01" min="0" max="100"
                               value="{{ record.gst_percent or 0 }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Warranty (Months) *</label>
                        <input type="number" name="warranty_months" class="form-control"
                               min="0"
                               value="{{ record.warranty_months or 0 }}" required>
                    </div>

                </div>

                <div class="d-flex justify-content-end gap-2 mt-4">
                    <a href="{{ url_for('view_imei_record', record_id=record.id) }}"
                       class="btn btn-light">
                        Cancel
                    </a>

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-1"></i>
                        Save Changes
                    </button>
                </div>

            </div>
        </div>
    </form>

</div>
{% endblock %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}MobileStore ERP{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <style>
        .app-navbar {
            background: #171b2d;
            padding: 10px 22px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
        }

        .app-brand {
            color: #fff;
            font-weight: 750;
            text-decoration: none;
        }

        .app-brand:hover {
            color: #dedfff;
        }

        .account-button {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 8px 12px;
            color: #fff;
            background: #303253;
            border: 1px solid #454969;
            border-radius: 9px;
        }

        .account-button:hover,
        .account-button:focus {
            color: #fff;
            background: #41446b;
        }

        .account-menu {
            min-width: 215px;
            padding: 7px;
            border: 1px solid #e9ebf3;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, .12);
        }

        .account-menu .dropdown-item {
            padding: 10px;
            border-radius: 7px;
        }

        .account-menu .dropdown-item i {
            width: 22px;
        }

        .account-role {
            color: #858ba0;
            font-size: 12px;
        }

        @media (max-width: 575px) {
            .app-navbar {
                padding: 9px 12px;
            }

            .account-button .account-name {
                max-width: 135px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
        }
        /* Hover effect for all sidebar links */
.side-link,
.nav-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    margin: 4px 10px;
    border-radius: 8px;
    color: #cbd5e1;
    text-decoration: none;
    transition: all 0.25s ease;
}

/* Hover effect */
.side-link:hover,
.nav-link:hover {
    background-color: #2563eb;
    color: #ffffff;
    transform: translateX(5px);
}

/* Keep icons white on hover */
.side-link:hover i,
.nav-link:hover i {
    color: #ffffff;
}

/* Active sidebar link */
.side-link.active,
.nav-link.active {
    background-color: #1d4ed8;
    color: #ffffff;
}

/* Smooth icon transition */
.side-link i,
.nav-link i {
    transition: color 0.25s ease;
}

/* Sidebar link base style */
.side-link,
.nav-link {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    margin: 5px 10px;
    border-radius: 8px;
    color: #cbd5e1;
    text-decoration: none;
    overflow: hidden;

    transition:
        background-color 0.3s ease,
        color 0.3s ease,
        transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.3s ease;
}

/* Left accent bar */
.side-link::before,
.nav-link::before {
    content: "";
    position: absolute;
    left: 0;
    top: 20%;
    width: 4px;
    height: 60%;
    background: #60a5fa;
    border-radius: 0 5px 5px 0;
    opacity: 0;
    transform: scaleY(0.3);
    transition:
        opacity 0.3s ease,
        transform 0.3s ease;
}

/* Smooth hover with left-side shadow */
.side-link:hover,
.nav-link:hover {
    background: linear-gradient(
        100deg,
        rgba(37, 99, 235, 0.28),
        rgba(37, 99, 235, 0.08)
    );
    color: #ffffff;
    transform: translateX(4px);
    box-shadow:
        -5px 0 12px rgba(59, 130, 246, 0.18),
        0 4px 14px rgba(0, 0, 0, 0.12);
}

/* Animate the accent bar */
.side-link:hover::before,
.nav-link:hover::before {
    opacity: 1;
    transform: scaleY(1);
}

/* Icon transition */
.side-link i,
.nav-link i {
    transition:
        color 0.3s ease,
        transform 0.3s ease;
}

.side-link:hover i,
.nav-link:hover i {
    color: #93c5fd;
    transform: scale(1.08);
}

/* Active link */
.side-link.active,
.nav-link.active {
    background: rgba(37, 99, 235, 0.22);
    color: #ffffff;
    box-shadow: inset 3px 0 0 #60a5fa;
}

/* Respect reduced-motion preferences */
@media (prefers-reduced-motion: reduce) {
    .side-link,
    .nav-link,
    .side-link i,
    .nav-link i,
    .side-link::before,
    .nav-link::before {
        transition: none;
    }
}

    </style>

    {% block extra_css %}{% endblock %}
</head>

<body class="bg-light">

    {% if current_user.is_authenticated %}
    <nav class="navbar app-navbar">
        <div class="container-fluid px-0">
            <a class="app-brand" href="{{ url_for('dashboard_page') }}">
                <i class="bi bi-phone me-2"></i>MobileStore ERP
            </a>

            <div class="dropdown">
                <button
                    class="btn account-button dropdown-toggle"
                    type="button"
                    id="accountDropdown"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">

                    <i class="bi bi-person-circle fs-5"></i>
                    <span class="account-name">
                        {{ current_user.full_name or current_user.username }}
                    </span>
                </button>

                <ul
                    class="dropdown-menu dropdown-menu-end account-menu"
                    aria-labelledby="accountDropdown">

                    <li class="px-3 py-2">
                        <div class="fw-semibold">
                            {{ current_user.full_name or current_user.username }}
                        </div>
                        <div class="account-role">
                            {{ current_user.role|title }}
                        </div>
                    </li>

                    <li><hr class="dropdown-divider"></li>

                    <li>
                        <a class="dropdown-item"
                           href="{{ url_for('profile_settings') }}">
                            <i class="bi bi-gear"></i>
                            Profile Settings
                        </a>
                    </li>

                    <li>
                        <form method="POST"
                              action="{{ url_for('logout_page') }}">
                            <input type="hidden"
                                   name="csrf_token"
                                   value="{{ csrf_token() }}">

                            <button type="submit"
                                    class="dropdown-item text-danger">
                                <i class="bi bi-box-arrow-right"></i>
                                Sign Out
                            </button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    {% endif %}

    {% block content %}{% endblock %}

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    {% block extra_js %}{% endblock %}

</body>
</html>
